name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request with a focus on:
            - Bugs and correctness issues
            - Security implications
            - Performance considerations
            - Maintainability and readability

            Also check the change against this repo's own conventions:
            - Domain vocabulary: read CONTEXT.md and flag any code, naming, or comments
              that drift from the terms defined there (e.g. wrong entity names).
            - Coding standards: read CODE_STANDARDS.md and flag any deviation from the
              stack, layout, and conventions it documents.

            Note: The PR branch is already checked out in the current working directory.

            Post one top-level summary comment with `gh pr comment`. Use
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            for comments tied to specific lines. Only post GitHub comments — this is a
            comment-only review, do not modify any files or push commits.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
